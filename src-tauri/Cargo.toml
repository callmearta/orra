[package]
name = "orra"
version = "0.1.7"
edition = "2024"
# Two binaries are declared below, so `cargo run` needs to be told which one is
# the app; the Tauri CLI shells out to a bare `cargo run`.
default-run = "orra"

# Both binaries are named explicitly: declaring any [[bin]] disables
# auto-discovery, and `src/bin/ctl.rs` would otherwise build as plain `ctl`
# rather than the `orra-ctl` the Hyprland bind invokes.
[[bin]]
name = "orra"
path = "src/main.rs"

[[bin]]
name = "orra-ctl"
path = "src/bin/ctl.rs"

[features]
# Tauri decides at compile time whether a build talks to the CLI's dev server or
# to the assets embedded in the binary, and it decides on this feature. Without
# it, *every* plain `cargo build`/`cargo run` — debug or release — bakes in
# `http://127.0.0.1:1430/../ui`, the URL of `tauri dev`'s static server, and dies
# with a 404 the moment that server is not the one running.
#
# On by default so the binary from `cargo run`, `cargo build --release` and the
# autostart entry is self-contained. The CLI strips it back out for `tauri dev`,
# which is the one case where the dev server is what we want.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1.0.104"
# Gemini's live socket carries its audio as base64 inside JSON. Already in the
# tree transitively, so this adds no build.
base64 = "0.22.1"
# Local calendar days for the Insights aggregates: streaks and the
# month-over-month comparison are defined on the user's own days, and std has no
# local-time conversion. Already in the tree transitively, so this adds no build.
chrono = "0.4.45"
cpal = "0.18.2"
futures-util = "0.3.34"
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The one-click local model downloads a binary this app then executes, so what
# arrives is checked against a pinned sha256 before it is used. Already in the
# tree transitively, so this adds no build.
sha2 = "0.10.9"
# The HUD is a transparent window, which Tauri gates behind `macos-private-api`.
# It has to sit on this dependency rather than a macOS-only one: `tauri-build`
# reads exactly this declaration and refuses to build when `macOSPrivateApi` is
# set in tauri.conf.json without it. The feature is inert away from macOS, so
# every release carries it. It is the private-API route, which the App Store
# rejects; Orra ships outside the App Store.
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }

# Killing a leftover engine at startup asks the kernel directly rather than
# shelling out to `kill` for one call (see `engine::reap_leftovers` — Linux
# only, which is also where this is used). Already in the tree transitively, so
# this adds no build.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

# macOS typing posts key events directly instead of going through `osascript`
# and System Events: one permission rather than two, no process per keystroke,
# and a failure that can be reported instead of dropped. `objc2` is for the
# HUD's NSWindow, whose fullscreen behaviour Tauri exposes no setter for. Both
# are already in the tree transitively, so this adds no build.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2 = "0.6.4"

# Windows delivery talks to the OS directly rather than shelling out to
# `powershell` and `clip`, which cost a console window each and mangled the
# clipboard. Already in the tree transitively, so this adds no build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[lints.clippy]
# `if let` chains read badly once there are more than two of them, and most
# collapsible sites here are a platform check wrapping a capability probe,
# where the nesting is what says "this whole group is one condition". The
# suggested rewrite is a stack of `&& let` lines that is harder to follow.
collapsible_if = "allow"
