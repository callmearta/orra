name: Release

# Cut a release by pushing a tag that matches the version in
# src-tauri/tauri.conf.json:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# Every platform builds into the same GitHub Release. The workflow can also be
# run by hand from the Actions tab to check the build without tagging — that
# run uploads downloadable artifacts but publishes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two tags pushed at once should not race each other into the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    permissions:
      # tauri-action creates and uploads to the GitHub Release.
      contents: write
    env:
      # linuxdeploy ships its own binutils, and that `strip` predates the
      # `.relr.dyn` ELF section modern distros emit. It fails on every system
      # library it is handed — "unknown type [0x13] section `.relr.dyn'" — and
      # linuxdeploy then exits non-zero, which Tauri reports only as the
      # unhelpful "failed to run linuxdeploy". Skipping the strip costs some
      # AppImage size and is the difference between a bundle and no bundle.
      # Harmless on Windows, where it is ignored.
      NO_STRIP: 1
    strategy:
      # One platform failing must not cancel the other, or a Windows-only
      # problem would silently cost us the Linux bundles too.
      fail-fast: false
      matrix:
        include:
          - label: Linux — AppImage, deb, rpm
            platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - label: Windows — NSIS installer
            platform: windows-latest
            bundles: nsis
          # The .dmg carries the .app. Intel Macs are covered because the engine
          # below is built universal; the app itself is whatever the runner is.
          - label: macOS — dmg
            platform: macos-14
            bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # A tag that disagrees with the app version produces installers whose
      # internal version contradicts the release they sit under. Cheap to
      # catch here, painful to notice later.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag  tauri.conf.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the app version $version — bump src-tauri/tauri.conf.json, Cargo.toml and package.json, or retag."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and the Tauri toolchain; patchelf and libfuse2 are for
      # AppImage, and rpm for the RPM bundle.
      #
      # libasound2-dev is the one package the usual Tauri list omits: cpal links
      # ALSA to capture the microphone, and without alsa.pc the build dies in
      # alsa-sys long before it reaches bundling.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            patchelf \
            libfuse2 \
            rpm \
            curl \
            wget \
            file

      # whisper.cpp publishes no command-line build for macOS — Apple gets an
      # xcframework — so the engine the app downloads there is one this workflow
      # compiles. Universal (arm64 + x86_64), statically linked so the one file
      # is the whole engine, Metal shaders embedded, and ad-hoc signed: an
      # unsigned arm64 binary is killed by the kernel the moment it is run.
      #
      # The hash is exported for the app build below, which bakes it in. That is
      # what keeps "what was built here" and "what the app will later execute"
      # the same thing, and it is why the release and the engine are one job.
      - name: Build the macOS engine
        if: matrix.platform == 'macos-14'
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b5130 \
            https://github.com/ggml-org/whisper.cpp.git engine-src
          git -C engine-src submodule update --init --recursive --depth 1

          cmake -S engine-src -B engine-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build engine-build --config Release --parallel

          codesign --force --sign - engine-build/bin/whisper-server

          # The app strips one path component when it unpacks, so the binary has
          # to sit inside a directory rather than at the archive root.
          mkdir -p engine-stage/whisper-server-macos-universal
          cp engine-build/bin/whisper-server engine-stage/whisper-server-macos-universal/
          tar -czf whisper-server-macos-universal.tar.gz \
            -C engine-stage whisper-server-macos-universal

          sha="$(shasum -a 256 whisper-server-macos-universal.tar.gz | awk '{print $1}')"
          echo "ORRA_MACOS_ENGINE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "whisper-server-macos-universal.tar.gz sha256: $sha"

      # Tauri signs with the identity named in tauri.conf.json, which is a
      # Developer ID certificate. CI only has that when APPLE_CERTIFICATE is set,
      # and the CLI must not see the variable at all when it is not: an *empty*
      # APPLE_CERTIFICATE reads as "a certificate was provided" and the import
      # fails, which is what took the build down. So the secrets are published to
      # the rest of the job only when there is a certificate, and otherwise the
      # identity falls back to ad-hoc — green, but macOS then forgets the
      # microphone and Accessibility grants on every update.
      - name: Configure the macOS signing
        if: matrix.platform == 'macos-14'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CERTIFICATE:-}" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=${CERTIFICATE_PASSWORD:-}"
            } >> "$GITHUB_ENV"
            # Only when notarizing is set up: an empty APPLE_ID is the same
            # trap as an empty certificate.
            if [ -n "${NOTARY_ID:-}" ]; then
              {
                echo "APPLE_ID=$NOTARY_ID"
                echo "APPLE_PASSWORD=${NOTARY_PASSWORD:-}"
                echo "APPLE_TEAM_ID=${NOTARY_TEAM:-}"
              } >> "$GITHUB_ENV"
            fi
            echo "Signing with the Developer ID certificate from APPLE_CERTIFICATE."
            exit 0
          fi
          echo "::warning::APPLE_CERTIFICATE is not set — signing macOS ad-hoc. Users will have to re-grant the microphone and Accessibility after every update."
          python3 -c "import json,pathlib;p=pathlib.Path('src-tauri/tauri.conf.json');c=json.loads(p.read_text());c['bundle']['macOS']['signingIdentity']='-';p.write_text(json.dumps(c,indent=2)+chr(10))"

      # Tagged build: build and publish to the Release for this tag.
      - name: Build and publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Orra ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Hold a key, speak, let go — the words are typed into whatever window
            has focus.

            **Linux**
            - `.AppImage` — runs on any distro: `chmod +x Orra_*.AppImage && ./Orra_*.AppImage`
            - `.deb` — Debian, Ubuntu: `sudo apt install ./Orra_*.deb`
            - `.rpm` — Fedora, RHEL: `sudo dnf install ./Orra-*.rpm`

            The deb and rpm declare `wtype` and `wl-clipboard` as dependencies.
            On an X11 session you want `xdotool` instead of `wtype`.

            **Windows** — run the `-setup.exe` installer.

            **macOS** — open the `.dmg` and drag Orra into Applications. The
            build is unsigned, so the first launch needs right-click → Open.
            Dictation and the one-click local models work; launch-at-login does
            not.

            Orra needs an API key for one of Deepgram, AssemblyAI or Gemini; see
            the [README](https://github.com/callmearta/orra#api-keys). Translation
            can also run against any OpenAI-compatible endpoint you point it at.

            When something fails — a translation that could not reach the
            service, a key that was refused — the reason now stays on screen
            until you close it, rather than disappearing after a few seconds.
            **Copy log** puts the whole error, with your version and platform, on
            the clipboard, which is what to send with a bug report.

      # Untagged run (workflow_dispatch): same build, no release.
      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}

      # The Flatpak packages the binaries the step above just produced, so it
      # runs here rather than as a job of its own — a second runner would build
      # the same commit from scratch to arrive at the same two files.
      - name: Install flatpak-builder
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # A runner starts with neither installation populated, so the
          # runtimes go into the user one — which is what tells build.sh to
          # pass --user, since it otherwise prefers a system install that is
          # already there and needs no download.
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Sdk//50 org.gnome.Platform//50

      - name: Build the Flatpak
        if: matrix.platform == 'ubuntu-22.04'
        run: ./packaging/flatpak/build.sh --no-build --repo

      # Published beside the deb, the rpm and the AppImage, because a Flatpak
      # is only useful to someone who has the file.
      - name: Attach the Flatpak to the release
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            packaging/flatpak/ai.orra.desktop.flatpak --clobber

      # The app fetches this on first use, with the hash baked in above, so it
      # has to sit in the same release the app was published to.
      - name: Attach the macOS engine to the release
        if: matrix.platform == 'macos-14' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            whisper-server-macos-universal.tar.gz --clobber

      # Keeps a manual run useful, and gives every run its bundles as
      # downloadable artifacts even if publishing failed. The macOS engine goes
      # up with them so an untagged run can be checked end to end.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: orra-${{ matrix.platform }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            packaging/flatpak/ai.orra.desktop.flatpak
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            whisper-server-macos-universal.tar.gz
